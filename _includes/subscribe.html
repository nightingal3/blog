<style type="text/css">
  #subscribe-form {
    width: 100%;
    font-family: "PT Serif", Georgia, "Times New Roman", serif;
    color: #515151;
  }
  #subscribe-form h2 {
    font-family: "PT Sans", Helvetica, Arial, sans-serif;
    font-weight: 400;
    font-size: .95rem;
    color: #313131;
    letter-spacing: -.025rem;
    margin-top: 0;
    margin-bottom: .4em;
  }
  #subscribe-form label {
    font-family: "PT Sans", Helvetica, Arial, sans-serif;
    font-size: .75rem;
    display: block;
    margin-bottom: .2em;
  }
  #subscribe-form input[type="email"] {
    width: 100%;
    padding: .3em .45em;
    font-family: "PT Serif", Georgia, "Times New Roman", serif;
    font-size: .85rem;
    color: #515151;
    border: 1px solid #e5e5e5;
    border-radius: 3px;
    box-sizing: border-box;
    margin-bottom: .5em;
    background-color: #fff;
  }
  #subscribe-form input[type="email"]:focus {
    outline: none;
    border-color: #79ada4;
  }
  #subscribe-form button {
    font-family: "PT Sans", Helvetica, Arial, sans-serif;
    font-size: .75rem;
    padding: .3em .85em;
    color: #fff;
    background-color: #79ada4;
    border: none;
    border-radius: 3px;
    cursor: pointer;
  }
  #subscribe-form button:hover {
    background-color: #5d9188;
  }
  #subscribe-msg {
    margin-top: 0.5em;
    font-size: 0.9rem;
    font-family: "PT Sans", Helvetica, Arial, sans-serif;
  }
</style>
<div id="subscribe-form">
  <form id="fs-subscribe-form" action="https://buttondown.com/api/emails/embed-subscribe/nightingal3" method="POST">
    <h2>Hear about new posts</h2>
    <label for="fs-email">Email Address</label>
    <input type="email" id="fs-email" name="email" placeholder="you@example.com" required>
    <button type="submit">Subscribe</button>
  </form>
  <p id="subscribe-msg" style="display:none"></p>
</div>
<script>
  (function () {
    var form = document.getElementById('fs-subscribe-form');
    var msg  = document.getElementById('subscribe-msg');
    if (!form) return;
    form.addEventListener('submit', function (e) {
      e.preventDefault();
      var data = new URLSearchParams();
      data.append('email', form.querySelector('input[type="email"]').value);
      data.append('embed', '1');
      fetch(form.action, {
        method: 'POST',
        body: data,
        headers: { 'Content-Type': 'application/x-www-form-urlencoded' }
      }).then(function (res) {
        if (res.ok) {
          form.style.display = 'none';
          msg.style.display  = 'block';
          msg.textContent    = "Thanks! You'll hear from me when new posts go up.";
        } else {
          msg.style.display  = 'block';
          msg.textContent    = 'Something went wrong — please try again later.';
        }
      }).catch(function () {
        msg.style.display  = 'block';
        msg.textContent    = 'Something went wrong — please try again later.';
      });
    });
  })();
</script>
